<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>魔法法典 · 霍格沃茨魔法世界社交游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=IM+Fell+English&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 全局状态层 -->
  <div id="global-status" class="hidden"></div>

  <!-- 顶部栏 -->
  <header class="top-bar">
    <div id="game-time" class="time"></div>
    <div class="profile">
      <!-- 头像，支持点击上传 -->
      <img src="avatar.png" alt="头像" class="avatar" id="avatarImg" />
      <span class="online-dot"></span>
    </div>
  </header>

  <h1 class="title">魔法法典</h1>

  <!-- 主视图容器 -->
  <main id="view-container">
    <!-- 闲聊 -->
    <div class="tab-view" id="tab-chat">
      <div class="friend-scroll-wrap">
        <div class="friend-scroll" id="friendScroll"></div>
        <div class="group-chat-bar" id="groupChatBar"></div>
      </div>
      <div class="chat-view" id="chatView"><div class="chat-messages" id="chatMessages"></div></div>
      <div class="map-view" id="mapView" style="display:none;">
        <div class="map-header"><button class="btn btn-small" id="backToChatBtn">← 返回聊天</button>
          <span class="map-location-label">📍 <strong id="mapLocLabel">大礼堂</strong></span></div>
        <pre class="map-ascii" id="mapAscii"></pre>
      </div>
      <div class="chat-input-bar" id="chatInputBar">
        <input type="text" id="chatInput" placeholder="输入消息..." autocomplete="off" />
        <button class="btn btn-send" id="chatSendBtn">发送</button>
      </div>
    </div>
    <!-- 日历 -->
    <div class="tab-view" id="tab-calendar" style="display:none;">
      <div class="cal-header"><div class="cal-date-big" id="calDateBig"></div><div class="cal-period-big" id="calPeriodBig"></div></div>
      <div class="card cal-week-card"><h3>本周日程</h3><div class="cal-week-grid" id="calWeekGrid"></div></div>
    </div>
    <!-- 档案 -->
    <div class="tab-view" id="tab-profile" style="display:none;">
      <div class="card" id="profileBasicCard"><h3>基本信息</h3><p>名字：<strong id="profileName"></strong></p><p>学院：<strong id="profileHouse"></strong></p><p>年级：<strong id="profileYear"></strong></p></div>
    </div>
    <!-- 枢纽 -->
    <div class="tab-view" id="tab-hub" style="display:none;">
      <div class="card"><h3>连接设置</h3><label for="cfgBaseUrl">Base URL</label><input id="cfgBaseUrl" type="text" placeholder="https://.../v1" /><label for="cfgApiKey">API Key</label><input id="cfgApiKey" type="password" placeholder="sk-..." /><label for="cfgModel">模型名称</label><input id="cfgModel" type="text" placeholder="模型ID" /><button class="btn btn-primary" id="saveSettingsBtn">保存设置</button></div>
      <div class="card"><h3>数据管理</h3><button class="btn btn-small" id="clearCacheBtn">清理缓存</button><button class="btn btn-small btn-danger" id="resetDataBtn">数据重置</button><button class="btn btn-small" id="exportConfigBtn">导出配置</button><button class="btn btn-small" id="importConfigBtn">导入配置</button><input type="file" id="importFileInput" accept=".json" style="display:none;" /><div id="settingsResult"></div></div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item" data-view="chat">闲聊</button>
    <button class="nav-item" data-view="calendar">日历</button>
    <button class="nav-item" data-view="profile">档案</button>
    <button class="nav-item" data-view="hub">枢纽</button>
  </nav>

  <footer class="footer">魔法法典版本 · 测试 v0.03</footer>

  <!-- 公告按钮（卷轴图标） -->
  <div id="announcement-toggle" class="announcement-toggle" title="公告">📜</div>
  <!-- 公告面板 -->
  <div id="announcement-panel" class="announcement-panel hidden" aria-hidden="true">
    <div class="panel-header"><span>公告</span><button id="announcement-close" class="close-btn">×</button></div>
    <div class="panel-content" id="announcement-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
